{% extends "base.html" %}
{% block title %}Şifre Değiştir — NoteTodo{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Şifre Değiştir</h1>
  <form method="post" autocomplete="off">
    <label for="current_password">Mevcut Şifre</label>
    <input type="password" id="current_password" name="current_password" required autofocus>

    <label for="new_password">Yeni Şifre</label>
    <input type="password" id="new_password" name="new_password" required minlength="4">

    <label for="confirm_password">Yeni Şifre (Tekrar)</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="4">

    <button type="submit" class="btn btn-primary btn-block">Şifreyi Güncelle</button>
    <a href="{{ url_for('todos') }}" class="btn btn-outline btn-block" style="margin-top:.5rem">İptal</a>
  </form>
</div>
{% endblock %}
